name: Dependabot PR Review

on:
  workflow_call:
    inputs:
      runs-on:
        description: 'The type of machine to run the job on'
        required: false
        type: string
        default: 'ubuntu-latest'
      model:
        description: 'The Claude model to use'
        required: false
        type: string
        default: 'global.anthropic.claude-sonnet-5-5'
      region:
        description: 'AWS region to use'
        required: false
        type: string
        default: 'ap-northeast-1'
      emit-verdict:
        description: >-
          レビューコメントに自動マージ判定用のマーカーを埋め込むか。
          true の場合、判定を機械可読にするため track_progress を無効化する。
        required: false
        type: boolean
        default: false
      publish-check-run:
        description: >-
          レビュー判定を Check Run として publish するか。
          true の場合は emit-verdict を自動的に有効化する。
          利用側ジョブで checks: write の付与が必要。
        required: false
        type: boolean
        default: false
      check-name:
        description: 'publish-check-run が true のときに作成する Check Run 名'
        required: false
        type: string
        default: 'dependabot-code-review'
      show-full-output:
        description: 'Pass show_full_output to claude-code-action (prints full Claude output to logs; may expose sensitive data)'
        required: false
        type: boolean
        default: false
    secrets:
      AWS_ROLE_TO_ASSUME:
        required: true

permissions:
  actions: read
  contents: read
  id-token: write
  issues: write
  pull-requests: write
  # publish-check-run 利用時にのみ実際に使用される（呼び出し側の付与権限で上限が決まる）
  checks: write

jobs:
  review:
    name: AI review comment (dependabot)
    runs-on: ${{ inputs.runs-on }}
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
      id-token: write
      checks: write
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ inputs.region }}

      - name: Claude AI Review (Comment Only)
        uses: anthropics/claude-code-action@88eabbf1b47534a9f4a76ff5f8502b07f2d67ef5 # v1.0.239
        with:
          use_bedrock: true
          show_full_output: ${{ inputs.show-full-output }}
          # 判定マーカーを機械解析する場合は、専用コメントに確実に残すため
          # track_progress を無効化する（既定では従来通り有効）。
          track_progress: ${{ !(inputs.emit-verdict || inputs.publish-check-run) }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_bots: "*"
          prompt: |
            **Language: 日本語で回答**

            PR #${{ github.event.pull_request.number }} は Dependabot によるバージョンアップです。
            自動マージは行いません。破壊的変更の有無と実使用箇所への影響を分析し、
            人間のレビュアーへの情報提供としてコメントを残してください。

            ## 分析手順

            1. `gh pr view ${{ github.event.pull_request.number }}` で PR 本文・リリースノートを確認する
            2. `gh pr diff ${{ github.event.pull_request.number }}` で変更内容を確認する
            3. **Elixir プロジェクト（mix.lock が変更されている場合）**: mix.lock の差分から更新された全パッケージ（Dependabot が直接ターゲットにしたものだけでなく、依存として連鎖更新されたパッケージも含む）を特定する
            4. 特定した各パッケージをこのリポジトリで実際に使用している箇所を `Grep` や `Read` で確認する
            5. 実使用箇所があるパッケージについてのみ、`WebFetch` でリリースノートを確認し、破壊的変更の有無と実使用箇所への影響を評価する（実使用箇所がないパッケージは「影響なし」として個別調査は省略してよい）

            ## dependabot ignore 設定の確認

            Dependabot の security update は `.github/dependabot.yml` の `ignore` 設定を無視して作成されるため、
            意図的に更新を抑制しているパッケージの PR が作成されることがあります。
            そのため、次の手順で `ignore` に該当するかを必ず確認してください。

            1. `Read` で `.github/dependabot.yml` を読む（存在しない、または `ignore` が無い場合は「該当なし」として次へ進む）
            2. PR の更新対象（ecosystem・ディレクトリ・パッケージ名・旧バージョン → 新バージョン）を、
               `updates` のうち `package-ecosystem` と `directory` が一致するエントリの `ignore` と照合する
               - `dependency-name` はワイルドカード（例: `@chakra-ui/*`）を考慮して一致判定する
               - `update-types` がある場合は、今回のバージョン差分（major / minor / patch）が含まれるときのみ該当とする。無い場合は全バージョンが対象
               - `versions` がある場合は、新バージョンがその範囲に含まれるときのみ該当とする
               - グループ更新 PR の場合は、含まれるすべてのパッケージについて照合する
            3. 1 つでも該当する場合は「ignore 対象」として扱い、コメントの「## dependabot ignore 設定」セクションに
               該当したパッケージ・ルール・設定ファイル上の理由コメント（あれば）・security update に起因するかを記載する
            4. ignore 対象の PR は、破壊的変更や実使用箇所への影響の有無にかかわらず、承認可の判定にしてはならない
               （security 修正を含む場合も同様。取り込むか、別途パッチ等での対応が必要かは人間が判断する）

            ## レビューコメント

            コメント内で順序や件数などを番号で表す際は `#` を付けないこと（`#1` や `#123` が GitHub 上で無関係な Issue/PR へのリンクとして解釈されるため）。
            以下のテンプレートの内容を Write ツールでファイル（例: `/tmp/dependabot-review-comment.md`）に書き出してから、
            `gh pr comment ${{ github.event.pull_request.number }} --body-file <そのファイルパス>` で投稿してください。
            heredoc やシェルのパイプ経由での投稿（`gh pr comment ... -b "$(cat <<EOF ... )"` 等）は使わないこと。

            ```
            # Dependabot PR レビュー

            ## 対象
            <!-- パッケージ名@旧バージョン → 新バージョン（依存として連鎖更新されたパッケージがある場合はすべて列挙） -->

            ## サマリー
            <!-- 変更内容の概要 -->

            ## 破壊的変更
            - 状況: <!-- あり / なし / 確認不可 -->
            - 詳細: <!-- 破壊的変更の内容 -->

            ## 実使用箇所への影響
            <!-- 影響がある場合: ファイルパス:行番号、使用対象、変更内容、影響評価 -->
            <!-- 影響がない場合: 「影響なし」 -->

            ## dependabot ignore 設定
            <!-- 該当あり: パッケージ・該当した ignore ルール・理由コメント・security update か。人間の判断が必要な旨 -->
            <!-- 該当なし: 「該当なし」 -->

            ## 推奨アクション
            <!-- レビュアーへの推奨事項 -->
            ```
            ${{ (inputs.emit-verdict || inputs.publish-check-run) && 'なお自動マージ判定のため、このレビューコメントの先頭に必ず次の HTML コメント行を含めてください（画面には表示されません）。1行目: <!-- dependabot-code-review -->。続けて、dependabot ignore 設定に該当せず、かつ破壊的変更がなく実使用箇所への悪影響もない場合のみ <!-- dependabot-code-verdict:approved -->、dependabot ignore 設定に該当する場合、または破壊的変更・悪影響がある/確認できない場合は <!-- dependabot-code-verdict:changes-requested --> を付与してください。' || '' }}

            このPRは承認しないでください。コメントのみ残してください。
          claude_args: |
            --model ${{ inputs.model }}
            --allowedTools "Read,Write,Glob,Grep,WebFetch,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

      # publish-check-run が true のときのみ、レビュー判定を Check Run として
      # publish する。判定はコメントに埋め込まれた検証マーカーから導出する。
      # 承認可マーカーがあれば success、それ以外（マーカー無しを含む）は neutral。
      - name: Publish review verdict check run
        if: ${{ inputs.publish-check-run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CHECK_NAME: ${{ inputs.check-name }}
        run: |
          set -euo pipefail

          CONCLUSION=neutral
          COMMENT_ID=$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body // "" | contains("<!-- dependabot-code-review -->"))) | .id' \
            | tail -n 1)
          if [ -n "$COMMENT_ID" ]; then
            BODY=$(gh api "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}" --jq '.body // ""')
            case "$BODY" in *'<!-- dependabot-code-verdict:approved -->'*) CONCLUSION=success ;; esac
          fi

          echo "${CHECK_NAME} conclusion: ${CONCLUSION}"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/check-runs" \
            -f name="${CHECK_NAME}" \
            -f head_sha="${HEAD_SHA}" \
            -f status='completed' \
            -f conclusion="${CONCLUSION}" \
            -f 'output[title]=Dependabot code review' \
            -f "output[summary]=Dependabot code review 判定: ${CONCLUSION}" \
            > /dev/null
