name: CDK Diff on PR

on:
  workflow_call:
    inputs:
      aws_accounts:
        description: 'JSON array of AWS account configurations [{"id": "123456789", "name": "account-name"}, ...]'
        required: true
        type: string
      aws_region:
        description: 'AWS region'
        required: false
        type: string
        default: 'ap-northeast-1'
      aws_role_name:
        description: 'IAM role name to assume for CDK operations'
        required: true
        type: string
      node_version_file:
        description: 'Path to Node.js version file (e.g., .tool-versions, .nvmrc)'
        required: false
        type: string
        default: '.tool-versions'
      working_directory:
        description: 'Working directory for CDK operations'
        required: false
        type: string
        default: '.'
      drift_detection_timeout_sec:
        description: 'Timeout for drift detection in seconds'
        required: false
        type: number
        default: 300
      cdk_context:
        description: 'CDK context parameter key (e.g., "env" for --context env=<name>)'
        required: false
        type: string
        default: ''
      comment_mode:
        description: >
          PR comment verbosity. "full" (default) keeps the current behavior: every stack gets its own
          section, including a full resource table for stacks with no changes. "summary" adds a
          one-line-per-stack table at the top and only expands stacks that have a diff or a MODIFIED
          drift; everything else (all stacks, all resources, per-resource drift) is still written in
          full to the job log.
        required: false
        type: string
        default: 'full'

permissions:
  id-token: write
  contents: read
  pull-requests: write
  actions: read # summary モードでコメントから省いた詳細の参照先（本 Matrix Job のログ URL）を解決するため

jobs:
  diff:
    name: Show CDK Stack Diff
    strategy:
      fail-fast: false
      matrix:
        aws_account: ${{ fromJson(inputs.aws_accounts) }}

    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ${{ inputs.node_version_file }}

      - name: Cache node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-build-${{ hashFiles('**/package-lock.json') }}

      - name: Install dependencies
        working-directory: ${{ inputs.working_directory }}
        run: npm install

      - name: Checkout github-actions repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mixi-m/github-actions
          path: .github-actions-repo
          sparse-checkout: |
            scripts/cdk-diff

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: arn:aws:iam::${{ matrix.aws_account.id }}:role/${{ inputs.aws_role_name }}
          aws-region: ${{ inputs.aws_region }}

      - name: Check CFn Stack Diff
        working-directory: ${{ inputs.working_directory }}
        env:
          AWS_ACCOUNT: ${{ matrix.aws_account.id }}
          AWS_ACCOUNT_MAPPING: ${{ inputs.aws_accounts }}
          AWS_REGION: ${{ inputs.aws_region }}
          DRIFT_DETECTION_TIMEOUT_SEC: ${{ inputs.drift_detection_timeout_sec }}
          ENV_NAME: ${{ matrix.aws_account.name }}
          CDK_CONTEXT: ${{ inputs.cdk_context }}
          COMMENT_MODE: ${{ inputs.comment_mode }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          npx zx ${{ github.workspace }}/.github-actions-repo/scripts/cdk-diff/main.mjs
